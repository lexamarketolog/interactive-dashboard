<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отчёт — Контекстная реклама</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#1a1a2e;font-size:14px}
:root{
  --radius:12px;
  --shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 10px 25px rgba(0,0,0,.12);
}
#app{max-width:1440px;margin:0 auto;padding:24px 20px}

/* ── GATE ──────────────────────────────────────────────────────────────────── */
#gate{position:fixed;inset:0;background:rgba(15,23,42,.92);z-index:9999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.gate-card{background:#fff;border-radius:20px;padding:48px 44px;text-align:center;max-width:380px;width:90%;box-shadow:var(--shadow-lg)}
.gate-logo{font-size:28px;font-weight:800;color:#1e293b;margin-bottom:6px;letter-spacing:-1px}
.gate-sub{color:#94a3b8;font-size:13px;margin-bottom:32px}
.gate-label{font-size:12px;font-weight:600;color:#64748b;text-align:left;margin-bottom:8px;display:block}
.gate-input{width:100%;padding:12px 16px;border:2px solid #e2e8f0;border-radius:10px;font-size:16px;letter-spacing:4px;text-align:center;outline:none;transition:border .2s;margin-bottom:16px}
.gate-input:focus{border-color:#2563EB}
.gate-input.error{border-color:#ef4444;animation:shake .3s}
.gate-btn{width:100%;padding:13px;background:#2563EB;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:background .18s}
.gate-btn:hover{background:#1d4ed8}
.gate-err{color:#ef4444;font-size:12px;margin-top:8px;min-height:18px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ── HEADER ────────────────────────────────────────────────────────────────── */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:16px;flex-wrap:wrap}
.header-left h1{font-size:21px;font-weight:700;color:#1e293b}
.header-left p{color:#64748b;font-size:12px;margin-top:2px}
.header-right{display:flex;align-items:center;gap:12px}

/* User presence */
.users-bar{display:flex;align-items:center;gap:6px}
.user-avatar{width:32px;height:32px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);position:relative;cursor:default;flex-shrink:0}
.user-avatar .tooltip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;font-weight:400}
.user-avatar:hover .tooltip{opacity:1}

/* WS status */
.ws-status{display:flex;align-items:center;gap:6px;font-size:12px;color:#94a3b8}
.ws-dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;transition:background .3s}
.ws-dot.online{background:#22c55e}
.ws-dot.connecting{background:#f59e0b;animation:pulse-dot 1s infinite}
.ws-dot.offline{background:#ef4444}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}

/* ── TABS ───────────────────────────────────────────────────────────────────── */
.tabs{display:flex;gap:6px;margin-bottom:22px;background:#fff;padding:6px;border-radius:14px;box-shadow:var(--shadow);width:fit-content}
.tab{padding:9px 22px;border:none;background:none;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;color:#64748b;transition:all .18s}
.tab:hover{background:#f1f5f9}
.tab.active{color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.tab[data-brand=brand_a].active{background:#2563EB}
.tab[data-brand=brand_b].active{background:#7C3AED}
.tab[data-brand=brand_c].active{background:#059669}

/* ── KPI CARDS ──────────────────────────────────────────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:#fff;border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border-left:4px solid var(--brand)}
.kpi-label{font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi-value{font-size:22px;font-weight:700;color:#1e293b;line-height:1}
.kpi-sub{font-size:11px;color:#94a3b8;margin-top:4px}
.pos{color:#059669!important}
.neg{color:#dc2626!important}
.warn{color:#d97706!important}

/* ── CHARTS ─────────────────────────────────────────────────────────────────── */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
.chart-card{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.chart-card h3{font-size:13px;font-weight:600;color:#475569;margin-bottom:14px}
.chart-card h3 span{font-size:11px;font-weight:400;color:#94a3b8}
.chart-wrap{position:relative;height:260px}
@media(max-width:768px){.charts-grid{grid-template-columns:1fr}}

/* ── ANALYTICS ──────────────────────────────────────────────────────────────── */
.analytics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
@media(max-width:1024px){.analytics{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.analytics{grid-template-columns:1fr}}
.insight-card{background:#fff;border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);border-left:4px solid var(--ic,#94a3b8);display:flex;gap:12px;align-items:flex-start}
.ins-icon{font-size:22px;flex-shrink:0;line-height:1.1}
.ins-title{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}
.ins-val{font-size:20px;font-weight:700;color:var(--ic,#1e293b);line-height:1;margin-bottom:3px}
.ins-detail{font-size:11px;color:#94a3b8;line-height:1.45}
.insight-card.pos{--ic:#059669}.insight-card.neg{--ic:#dc2626}.insight-card.warn{--ic:#d97706}.insight-card.info{--ic:#2563EB}

/* ── FORECAST ROWS ──────────────────────────────────────────────────────────── */
tr.forecast-row td{background:#f5f3ff}
tr.forecast-row td.editable{background:#ede9fe}
tr.forecast-row td.formula{background:#f3f0ff}
tr.forecast-row:hover td{background:#ede9fe}
tr.forecast-row td:first-child{color:#6d28d9;font-style:italic}
.del-row-btn{width:18px;height:18px;border:none;background:none;cursor:pointer;color:#94a3b8;font-size:13px;padding:0;vertical-align:middle;border-radius:3px;transition:all .12s;margin-left:4px}
.del-row-btn:hover{background:#fee2e2;color:#dc2626}
.add-forecast-btn{padding:5px 12px;background:#7c3aed;color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s;white-space:nowrap}
.add-forecast-btn:hover{background:#6d28d9}
.export-btn{padding:5px 12px;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.export-btn:hover{background:#e2e8f0;color:#1e293b}

/* ── TABLE ──────────────────────────────────────────────────────────────────── */
.table-section{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.table-header{padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.table-header h2{font-size:14px;font-weight:600;color:#334155}
.table-hint{font-size:11px;color:#94a3b8;display:flex;align-items:center;gap:6px}
.table-scroll{overflow-x:auto;max-height:520px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{background:#f8fafc;color:#64748b;font-weight:600;padding:9px 10px;text-align:right;white-space:nowrap;position:sticky;top:0;border-bottom:2px solid #e2e8f0;font-size:11px;letter-spacing:.3px;text-transform:uppercase;z-index:2}
thead th:first-child{text-align:left;width:76px}
tbody tr{border-bottom:1px solid #f1f5f9;transition:background .1s}
tbody tr:hover{background:#f8fafc}
tbody td{padding:7px 10px;text-align:right;color:#334155}
tbody td:first-child{text-align:left;font-weight:600;color:#1e293b}
tfoot tr{border-top:2px solid #e2e8f0;background:#f8fafc;position:sticky;bottom:0;z-index:2}
tfoot td{padding:8px 10px;text-align:right;font-size:12px;font-weight:700;color:#1e293b;white-space:nowrap}
tfoot td:first-child{text-align:left;color:#475569}
tfoot td.tot-sum{color:#2563EB}
tfoot td.tot-avg{color:#7c3aed}
td.editable{background:#eff6ff;cursor:text;position:relative}
td.editable:focus-within{background:#dbeafe;box-shadow:inset 0 0 0 1.5px #3b82f6}
td.formula{background:#fefce8;cursor:text;position:relative}
td.formula:focus-within{background:#fef9c3;box-shadow:inset 0 0 0 1.5px #eab308}
td input{border:none;background:none;width:100%;text-align:right;font-size:12.5px;color:#1e293b;font-family:inherit;outline:none;padding:0}
td input:focus{color:#1d4ed8}
td.has-delta{display:flex;align-items:center;justify-content:flex-end;gap:4px}
td.has-delta input{width:auto;flex:1;min-width:0}
.mom-delta{font-size:10px;padding:1px 4px;border-radius:3px;white-space:nowrap;flex-shrink:0;font-weight:600}
.mom-up{background:#dcfce7;color:#15803d}
.mom-dn{background:#fee2e2;color:#dc2626}
.mom-flat{background:#f1f5f9;color:#94a3b8}
.edit-badge{display:inline-block;width:10px;height:10px;border-radius:2px;background:#dbeafe;border:1px solid #93c5fd}
.formula-badge{display:inline-block;width:10px;height:10px;border-radius:2px;background:#fefce8;border:1px solid #fbbf24}
/* ── HISTORY BAR ──────────────────────────────────────────────── */
.history-bar{display:flex;align-items:center;gap:8px;background:#fff;padding:7px 12px;border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.hist-btn{padding:5px 10px;border:1px solid #e2e8f0;border-radius:7px;background:#f8fafc;font-size:14px;cursor:pointer;color:#334155;transition:all .15s;flex-shrink:0;line-height:1}
.hist-btn:hover:not([disabled]){background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}
.hist-btn[disabled]{opacity:.3;cursor:not-allowed}
.hist-sep{width:1px;height:18px;background:#e2e8f0;flex-shrink:0;margin:0 2px}
.hist-entries{display:flex;gap:3px;overflow-x:auto;flex:1;scrollbar-width:none;align-items:center;min-height:24px}
.hist-entries::-webkit-scrollbar{display:none}
.hist-entry{padding:3px 9px;border-radius:6px;font-size:11px;color:#94a3b8;white-space:nowrap;cursor:pointer;border:1px solid transparent;flex-shrink:0;transition:all .1s}
.hist-entry:hover{background:#f1f5f9;color:#334155}
.hist-entry.cur{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe;font-weight:600}
.hist-time{font-size:10px;color:#cbd5e1;margin-right:3px}
.hist-entry.cur .hist-time{color:#93c5fd}
/* Share */
.share-btn{padding:6px 14px;background:#2563EB;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s;white-space:nowrap}
.share-btn:hover{background:#1d4ed8}
.share-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:9998;white-space:nowrap}
.share-toast.show{opacity:1}
/* Remote editor highlight */
td.remote-edit{outline:2px solid var(--re-color);background:color-mix(in srgb, var(--re-color) 12%, white)!important}
td.remote-edit::after{content:var(--re-name,'');position:absolute;top:-18px;left:0;background:var(--re-color);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px 4px 4px 0;white-space:nowrap;pointer-events:none;z-index:10}
</style>
</head>

<!-- ── PASSWORD GATE ──────────────────────────────────────────── -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-logo">Отчёт</div>
    <div class="gate-sub">Контекстная реклама · Яндекс Директ</div>
    <label class="gate-label">Код доступа</label>
    <input id="gate-input" class="gate-input" type="password" placeholder="••••••" maxlength="10" autocomplete="off">
    <button class="gate-btn" onclick="checkPass()">Войти</button>
    <div id="gate-err" class="gate-err"></div>
  </div>
</div>

<!-- ── MAIN APP ───────────────────────────────────────────────── -->
<div id="app">
  <div class="header">
    <div class="header-left">
      <h1>Отчёт — Контекстная реклама</h1>
      <p>Контекстная реклама · Яндекс Директ</p>
    </div>
    <div class="header-right">
      <div class="users-bar" id="users-bar"></div>
      <button class="share-btn" onclick="shareLink()">Поделиться ↗</button>
      <div class="ws-status">
        <div class="ws-dot connecting" id="ws-dot"></div>
        <span id="ws-label">подключение…</span>
      </div>
    </div>
  </div>

  <nav class="tabs">
    <button class="tab active" data-brand="brand_a">Бренд A</button>
    <button class="tab" data-brand="brand_b">Бренд B</button>
    <button class="tab" data-brand="brand_c">Бренд C</button>
  </nav>

  <div class="history-bar" id="history-bar">
    <button class="hist-btn" id="btn-undo" title="Отменить (Ctrl+Z)" disabled>↩</button>
    <button class="hist-btn" id="btn-redo" title="Повторить (Ctrl+Y)" disabled>↪</button>
    <div class="hist-sep"></div>
    <div class="hist-entries" id="hist-entries"><span style="font-size:11px;color:#cbd5e1">история изменений</span></div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="charts-grid">
    <div class="chart-card"><h3>Расход vs Доход <span>тыс. ₽</span></h3><div class="chart-wrap"><canvas id="chart-sr"></canvas></div></div>
    <div class="chart-card"><h3>Показы &amp; Клики <span>÷1000 / шт</span></h3><div class="chart-wrap"><canvas id="chart-ic"></canvas></div></div>
    <div class="chart-card"><h3>ROMI &amp; ДРР <span>%</span></h3><div class="chart-wrap"><canvas id="chart-romi"></canvas></div></div>
    <div class="chart-card"><h3>Покупки &amp; CPO <span>шт / ₽</span></h3><div class="chart-wrap"><canvas id="chart-purch"></canvas></div></div>
  </div>

  <div class="analytics" id="analytics"></div>

  <div class="table-section">
    <div class="table-header">
      <h2>Данные по месяцам</h2>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <button class="add-forecast-btn" onclick="addForecastRow()">+ Прогноз</button>
        <button class="export-btn" onclick="exportCSV()">↓ CSV</button>
        <div class="table-hint">
          <span class="edit-badge"></span> данные &nbsp;
          <span class="formula-badge"></span> цель &nbsp;
          <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#ede9fe;border:1px solid #a78bfa"></span> прогноз
        </div>
      </div>
    </div>
    <div class="table-scroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody><tfoot id="tfoot"></tfoot></table></div>
  </div>
</div>

<div class="share-toast" id="share-toast"></div>

// ═══════════════════════════════════════════════════════════════
//  COMPUTED
// ═══════════════════════════════════════════════════════════════
function compute(row) {
  const ctr  = row.i > 0  ? row.c / row.i * 100 : 0;
  const cpc  = row.c > 0  ? row.s / row.c : 0;
  const drr  = row.r > 0  ? row.s / row.r * 100 : 0;
  const romi = row.s > 0  ? (row.r - row.s) / row.s * 100 : 0;
  const cpo  = row.p > 0  ? row.s / row.p : 0;
  const avg  = row.p > 0  ? row.r / row.p : 0;
  return {...row, ctr, cpc, drr, romi, cpo, avg};
}

// ═══════════════════════════════════════════════════════════════
//  HISTORY (UNDO / REDO)
// ═══════════════════════════════════════════════════════════════
const hist = [];
let histPos = -1;

function deepClone(o) { return JSON.parse(JSON.stringify(o)); }
function hNow() { return new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }

function initHistory() {
  hist.length = 0;
  hist.push({state: deepClone(state), label:'Начало', time: hNow()});
  histPos = 0;
  renderHistoryPanel();
}

function pushHistory(label) {
  if (histPos < hist.length - 1) hist.splice(histPos + 1);
  hist.push({state: deepClone(state), label, time: hNow()});
  if (hist.length > 21) hist.shift();
  histPos = hist.length - 1;
  renderHistoryPanel();
}

function undo() {
  if (histPos <= 0) return;
  histPos--;
  state = deepClone(hist[histPos].state);
  fullRefresh();
  sendWS({type:'state_restore', state});
  renderHistoryPanel();
}

function redo() {
  if (histPos >= hist.length - 1) return;
  histPos++;
  state = deepClone(hist[histPos].state);
  fullRefresh();
  sendWS({type:'state_restore', state});
  renderHistoryPanel();
}

window.restoreFromHistory = function(pos) {
  if (pos < 0 || pos >= hist.length) return;
  histPos = pos;
  state = deepClone(hist[histPos].state);
  fullRefresh();
  sendWS({type:'state_restore', state});
  renderHistoryPanel();
};

function renderHistoryPanel() {
  const undoBtn = document.getElementById('btn-undo');
  const redoBtn = document.getElementById('btn-redo');
  const entries = document.getElementById('hist-entries');
  if (!entries) return;
  if (undoBtn) undoBtn.disabled = histPos <= 0;
  if (redoBtn) redoBtn.disabled = histPos >= hist.length - 1;
  entries.innerHTML = hist.map((h, i) => `
    <div class="hist-entry${i===histPos?' cur':''}" onclick="restoreFromHistory(${i})">
      <span class="hist-time">${h.time}</span>${h.label}
    </div>`).join('');
  const cur = entries.querySelector('.cur');
  if (cur) cur.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (!mod) return;
  if (e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  if ((e.key === 'z' && e.shiftKey) || e.key === 'y') { e.preventDefault(); redo(); }
});

// ═══════════════════════════════════════════════════════════════
//  WEBSOCKET
// ═══════════════════════════════════════════════════════════════
let ws = null;
let myUserId = null;

function wsUrl() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const basePath = location.pathname.startsWith('/example') ? '/example/ws' : '/ws';
  return `${proto}//${location.host}${basePath}`;
}

function setWsDot(cls, label) {
  const dot = document.getElementById('ws-dot');
  const lbl = document.getElementById('ws-label');
  if (dot) { dot.className = 'ws-dot ' + cls; }
  if (lbl) { lbl.textContent = label; }
}

function connectWS() {
  setWsDot('connecting', 'подключение…');
  try { ws = new WebSocket(wsUrl()); } catch(_) { setWsDot('offline','офлайн'); return; }

  ws.onopen = () => {
    setWsDot('online', 'онлайн');
    ws.send(JSON.stringify({type:'push_state', state}));
  };

  ws.onclose = () => {
    setWsDot('offline', 'офлайн');
    setTimeout(connectWS, 4000);
  };

  ws.onerror = () => setWsDot('offline', 'офлайн');

  ws.onmessage = (e) => {
    try { handleWS(JSON.parse(e.data)); } catch(_) {}
  };
}

function handleWS(msg) {
  switch (msg.type) {
    case 'welcome':
      myUserId = msg.me?.id;
      if (msg.state) { state = msg.state; fullRefresh(); }
      renderUsers(msg.users || []);
      initHistory();
      break;
    case 'users':
      renderUsers(msg.users || []);
      break;
    case 'edit':
      if (msg.userId !== myUserId) applyRemoteEdit(msg.brand, msg.ri, msg.field, msg.value);
      break;
    case 'focus':
      if (msg.user?.id !== myUserId) setRemoteEditor(msg.brand, msg.ri, msg.field, msg.user);
      break;
    case 'blur':
      if (msg.userId !== myUserId) clearRemoteEditor(msg.brand, msg.ri, msg.field);
      break;
    case 'state_restore':
      if (msg.userId !== myUserId) {
        state = msg.state;
        initHistory();
        fullRefresh();
      }
      break;
    case 'add_forecast_row':
      if (msg.userId !== myUserId) {
        state[msg.brand].push(msg.row);
        if (msg.brand === brand) { renderTable(); renderKPIs(); updateChartsInPlace(); }
      }
      break;
    case 'delete_forecast_row':
      if (msg.userId !== myUserId) {
        state[msg.brand].splice(msg.ri, 1);
        if (msg.brand === brand) { renderTable(); renderKPIs(); updateChartsInPlace(); }
      }
      break;
  }
}

function sendWS(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
}

// ── Remote editor highlighting ─────────────────────────────────
function remoteKey(b, ri, f) { return `${b}_${ri}_${f}`; }

function setRemoteEditor(b, ri, field, user) {
  if (!user) return;
  const key = remoteKey(b, ri, field);
  remoteEditors[key] = user;
  if (b !== brand) return;
  const td = document.querySelector(`#tbody tr[data-ri="${ri}"] td[data-field="${field}"]`);
  if (td) applyEditorStyle(td, user);
}

function clearRemoteEditor(b, ri, field) {
  const key = remoteKey(b, ri, field);
  delete remoteEditors[key];
  if (b !== brand) return;
  const td = document.querySelector(`#tbody tr[data-ri="${ri}"] td[data-field="${field}"]`);
  if (td) { td.classList.remove('remote-edit'); td.removeAttribute('style'); }
}

function applyEditorStyle(td, user) {
  td.classList.add('remote-edit');
  td.style.setProperty('--re-color', user.color);
  td.style.setProperty('--re-name', `"${user.name}"`);
}

function restoreRemoteEditors() {
  // Re-apply highlights after table re-render
  for (const [key, user] of Object.entries(remoteEditors)) {
    const [b, ri, field] = key.split('_');
    if (b !== brand) continue;
    const td = document.querySelector(`#tbody tr[data-ri="${ri}"] td[data-field="${field}"]`);
    if (td) applyEditorStyle(td, user);
  }
}

// ── Apply incoming edit without full re-render ─────────────────
function applyRemoteEdit(b, ri, field, value) {
  state[b][ri][field] = value;
  if (b !== brand) return; // different tab — state updated, no UI needed

  // Update input value if not focused by us
  const inp = document.querySelector(`#tbody tr[data-ri="${ri}"] td[data-field="${field}"] input`);
  if (inp && document.activeElement !== inp) inp.value = value;

  // Patch computed cells in that row
  const row = compute(state[b][ri]);
  const tr = document.querySelector(`#tbody tr[data-ri="${ri}"]`);
  if (tr) patchComputedCells(tr, row);

  updateChartsInPlace();
  renderKPIs();
}

const fmt = {
  num:  v => isNaN(v)||v==null ? '—' : v.toLocaleString('ru-RU'),
  rub:  v => isNaN(v)||v==null ? '—' : Math.round(v).toLocaleString('ru-RU') + ' ₽',
  pct:  v => isNaN(v)||v==null ? '—' : v.toFixed(1) + '%',
  dec:  v => isNaN(v)||v==null ? '—' : v.toFixed(2),
};

function monthLabel(m) {
  const [y,mo] = m.split('-');
  return ['','янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'][+mo] + ' ' + y.slice(2);
}

// ═══════════════════════════════════════════════════════════════
//  KPI CARDS
// ═══════════════════════════════════════════════════════════════
function renderKPIs() {
  const rows  = state[brand].map(compute);
  const meta  = BRAND_META[brand];
  const tot   = rows.reduce((a,r) => ({i:a.i+r.i,c:a.c+r.c,s:a.s+r.s,p:a.p+r.p,r:a.r+r.r}), {i:0,c:0,s:0,p:0,r:0});
  const romi  = tot.s > 0 ? (tot.r - tot.s) / tot.s * 100 : 0;
  const drr   = tot.r > 0 ? tot.s / tot.r * 100 : 0;
  const ctr   = tot.i > 0 ? tot.c / tot.i * 100 : 0;
  const cpo   = tot.p > 0 ? tot.s / tot.p : 0;

  const kpis = [
    {l:'Показы',  v:fmt.num(Math.round(tot.i/1000))+'k', s:''},
    {l:'Клики',   v:fmt.num(tot.c),  s:'CTR '+fmt.pct(ctr)},
    {l:'Расход',  v:fmt.rub(tot.s),  s:''},
    {l:'Доход',   v:fmt.rub(tot.r),  s:''},
    {l:'Покупки', v:fmt.num(tot.p),  s:'CPO '+fmt.rub(cpo)},
    {l:'ROMI',    v:fmt.pct(romi),   s:'доход vs расход', cls:romi>=0?'pos':'neg'},
    {l:'ДРР',     v:fmt.pct(drr),    s:'расход/доход',    cls:drr<=100?'pos':'neg'},
    {l:'Ср. чек', v:fmt.rub(tot.r/tot.p), s:''},
  ];

  document.getElementById('kpis').innerHTML = kpis.map(k => `
    <div class="kpi" style="--brand:${meta.color}">
      <div class="kpi-label">${k.l}</div>
      <div class="kpi-value ${k.cls||''}">${k.v}</div>
      ${k.s ? `<div class="kpi-sub">${k.s}</div>` : ''}
    </div>`).join('');
}

// ═══════════════════════════════════════════════════════════════
//  ANALYTICS
// ═══════════════════════════════════════════════════════════════
function renderAnalytics() {
  const cont = document.getElementById('analytics');
  if (!cont) return;
  const rows = state[brand].map(compute);
  if (rows.length < 2) { cont.innerHTML = ''; return; }
  const n = rows.length;

  // Aggregates
  const tot = rows.reduce((a,r) => ({s:a.s+r.s,r:a.r+r.r,c:a.c+r.c,p:a.p+r.p,i:a.i+r.i}), {s:0,r:0,c:0,p:0,i:0});
  const totalROMI = tot.s > 0 ? (tot.r-tot.s)/tot.s*100 : 0;
  const totalDRR  = tot.r > 0 ? tot.s/tot.r*100 : 0;

  // Last 3 vs prev 3 revenue
  const last3 = rows.slice(Math.max(0,n-3));
  const prev3 = rows.slice(Math.max(0,n-6), Math.max(0,n-3));
  const last3r = last3.reduce((a,r)=>a+r.r,0);
  const prev3r = prev3.reduce((a,r)=>a+r.r,0);
  const revGrowth = prev3r > 0 ? (last3r-prev3r)/prev3r*100 : null;

  // Last 3 vs prev 3 spend
  const last3s = last3.reduce((a,r)=>a+r.s,0);
  const prev3s = prev3.reduce((a,r)=>a+r.s,0);
  const spendGrowth = prev3s > 0 ? (last3s-prev3s)/prev3s*100 : null;

  // Best month
  const bestRev = rows.reduce((a,b) => b.r>a.r ? b : a);

  // Avg DRR last 3
  const avgDRR = last3.reduce((a,r)=>a+r.drr,0)/last3.length;

  // CPO dynamics
  const cpoLast = rows[n-1].cpo;
  const cpoPrev = n>=4 ? rows.slice(n-4,n-1).reduce((a,r)=>a+r.cpo,0)/3 : (n>=2?rows[n-2].cpo:cpoLast);
  const cpoChg  = cpoPrev>0 ? (cpoLast-cpoPrev)/cpoPrev*100 : 0;

  // Conversion click→purchase
  const avgConv  = tot.c>0 ? tot.p/tot.c*100 : 0;
  const lastConv = rows[n-1].c>0 ? rows[n-1].p/rows[n-1].c*100 : 0;

  const cards = [
    revGrowth !== null ? {
      cls: revGrowth>=0?'pos':'neg', icon: revGrowth>=0?'📈':'📉',
      title:'Тренд дохода (3 мес.)',
      val: (revGrowth>=0?'+':'')+revGrowth.toFixed(1)+'%',
      detail: `${fmt.rub(last3r)} vs ${fmt.rub(prev3r)} пред. период${spendGrowth!==null?' · расход '+(spendGrowth>=0?'+':'')+spendGrowth.toFixed(1)+'%':''}`,
    } : null,
    {
      cls: totalROMI>=0?'pos':'neg', icon:'💹',
      title:'ROMI за весь период',
      val: fmt.pct(totalROMI),
      detail:`Доход ${fmt.rub(tot.r)} · Расход ${fmt.rub(tot.s)}`,
    },
    {
      cls:'info', icon:'🏆',
      title:'Лучший месяц по доходу',
      val: fmt.rub(bestRev.r),
      detail:`${monthLabel(bestRev.m)} · ROMI ${fmt.pct(bestRev.romi)} · Покупки ${bestRev.p}`,
    },
    {
      cls: avgDRR<=80?'pos':avgDRR<=100?'warn':'neg',
      icon: avgDRR<=80?'✅':avgDRR<=100?'⚠️':'🚨',
      title:'Средний ДРР (3 мес.)',
      val: fmt.pct(avgDRR),
      detail:`Всего: ${fmt.pct(totalDRR)} · Цель: до 80%`,
    },
    {
      cls: cpoChg<=0?'pos':'neg', icon: cpoChg<=0?'🎯':'📊',
      title:'CPO последний месяц',
      val: fmt.rub(cpoLast),
      detail:`${cpoChg<=0?'↓':'↑'} ${Math.abs(cpoChg).toFixed(1)}% vs сред. 3 мес · Покупок: ${fmt.num(tot.p)}`,
    },
    {
      cls:'info', icon:'🔄',
      title:'Конверсия клик → покупка',
      val: fmt.pct(avgConv),
      detail:`Последний мес: ${fmt.pct(lastConv)} · Кликов всего: ${fmt.num(tot.c)}`,
    },
  ].filter(Boolean);

  cont.innerHTML = cards.map(c=>`
    <div class="insight-card ${c.cls}">
      <div class="ins-icon">${c.icon}</div>
      <div>
        <div class="ins-title">${c.title}</div>
        <div class="ins-val">${c.val}</div>
        <div class="ins-detail">${c.detail}</div>
      </div>
    </div>`).join('');
}

function nextMonth(m) {
  const [y, mo] = m.split('-').map(Number);
  return mo===12 ? `${y+1}-01` : `${y}-${String(mo+1).padStart(2,'0')}`;
}

window.exportCSV = function() {
  const rows = state[brand].map(compute);
  const header = COLS.map(c => '"' + c.l.replace(/"/g,'""') + '"').join(',');
  const body = rows.map(row => COLS.map(col => {
    if (col.k === 'm') return '"' + (row.forecast ? '[прогноз] ' : '') + monthLabel(row.m) + '"';
    let v;
    if (col.ed === 'rev') {
      v = col.val ? col.val(row) : col.fmt(row);
    } else {
      v = col.fmt(row);
    }
    const s = String(v).replace(/\s/g,'');
    return isNaN(parseFloat(s)) ? '"' + String(v).replace(/"/g,'""') + '"' : s;
  }).join(',')).join('\n');
  const blob = new Blob(['﻿' + header + '\n' + body], {type:'text/csv;charset=utf-8'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'report-' + brand + '-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
};

window.addForecastRow = function() {
  const rows = state[brand];
  if (!rows.length) return;
  const last = rows[rows.length-1];
  const nm   = nextMonth(last.m);
  const newRow = {...last, m: nm, forecast: true};
  state[brand].push(newRow);
  renderTable(); renderKPIs(); updateChartsInPlace(); renderAnalytics();
  document.querySelector('#tbody tr:last-child')?.scrollIntoView({behavior:'smooth', block:'nearest'});
  sendWS({type:'add_forecast_row', brand, row: newRow});
  pushHistory(`${BRAND_META[brand].label} · ${monthLabel(nm)} · прогноз`);
};

window.deleteRow = function(ri) {
  if (!state[brand][ri]?.forecast) return;
  const m = state[brand][ri].m;
  state[brand].splice(ri, 1);
  renderTable(); renderKPIs(); updateChartsInPlace(); renderAnalytics();
  sendWS({type:'delete_forecast_row', brand, ri});
  pushHistory(`${BRAND_META[brand].label} · ${monthLabel(m)} · прогноз удалён`);
};

const CD = { // chart defaults
  animation:{duration:320},
  plugins:{legend:{labels:{font:{size:11},boxWidth:12,padding:10}}},
  scales:{
    x:{grid:{display:false},ticks:{font:{size:10},maxRotation:45}},
    y:{grid:{color:'#f1f5f9'},ticks:{font:{size:10}}},

function makeChart(id, cfg) {
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(document.getElementById(id), cfg);
}

// Index of first forecast row (for chart styling)
function forecastSplitIdx(rows) {
  const i = rows.findIndex(r => r.forecast);
  return i === -1 ? rows.length : i;
}

// Per-point bar color arrays: lighter fill for forecast bars
function barColors(rows, si, hist, fore) {
  return rows.map((_,i) => i >= si ? fore : hist);
}

// Chart.js 4 segment callback: dashed line for forecast segments
function lineSeg(si) {
  return { borderDash: ctx => ctx.p0DataIndex >= si ? [6,3] : undefined };
}

// Update chart data WITHOUT destroying charts (prevents flicker during collab)
function updateChartsInPlace() {
  const rows = state[brand].map(compute);
  const {color:c, mid} = BRAND_META[brand];
  const labels = rows.map(r => monthLabel(r.m));
  const si = forecastSplitIdx(rows);

  if (charts['chart-sr']) {
    const ch = charts['chart-sr'];
    ch.data.labels = labels;
    ch.data.datasets[0].data = rows.map(r=>+(r.s/1000).toFixed(1));
    ch.data.datasets[0].backgroundColor = barColors(rows,si,c+'33',c+'18');
    ch.data.datasets[0].borderColor = barColors(rows,si,c,c+'66');
    ch.data.datasets[1].data = rows.map(r=>+(r.r/1000).toFixed(1));
    ch.update('none');
  }
  if (charts['chart-ic']) {
    const ch = charts['chart-ic'];
    ch.data.labels = labels;
    ch.data.datasets[0].data = rows.map(r=>+(r.i/1000).toFixed(0));
    ch.data.datasets[0].backgroundColor = barColors(rows,si,mid+'88',mid+'33');
    ch.data.datasets[0].borderColor = barColors(rows,si,mid,mid+'66');
    ch.data.datasets[1].data = rows.map(r=>r.c);
    ch.update('none');
  }
  if (charts['chart-romi']) {
    const ch = charts['chart-romi'];
    ch.data.labels = labels;
    ch.data.datasets[0].data = rows.map(r=>+r.romi.toFixed(1));
    ch.data.datasets[1].data = rows.map(r=>+r.drr.toFixed(1));
    ch.update('none');
  }
  if (charts['chart-purch']) {
    const ch = charts['chart-purch'];
    ch.data.labels = labels;
    ch.data.datasets[0].data = rows.map(r=>r.p);
    ch.data.datasets[0].backgroundColor = barColors(rows,si,c+'55',c+'20');
    ch.data.datasets[0].borderColor = barColors(rows,si,c,c+'66');
    ch.data.datasets[1].data = rows.map(r=>+r.cpo.toFixed(0));
    ch.update('none');
  }
  renderAnalytics();
}

const MOM_COLS = new Set(['s','r','p','romi']);

function momBadge(curr, prev) {
  if (prev == null || prev === 0) return '';
  const delta = (curr - prev) / Math.abs(prev) * 100;
  if (Math.abs(delta) < 1) return '';
  return delta > 0
    ? `<span class="mom-delta mom-up">↑ ${Math.round(delta)}%</span>`
    : `<span class="mom-delta mom-dn">↓ ${Math.round(Math.abs(delta))}%</span>`;
}

function renderTable() {
  document.getElementById('thead').innerHTML =
    '<tr>' + COLS.map(c=>`<th>${c.l}</th>`).join('') + '</tr>';

  const rows = state[brand].map(compute);
  document.getElementById('tbody').innerHTML = rows.map((row, ri) => {
    const isForecast = !!row.forecast;
    const trCls = isForecast ? ' class="forecast-row"' : '';
    // Previous non-forecast row for MoM delta
    let prevRow = null;
    if (!isForecast) {
      for (let j = ri - 1; j >= 0; j--) {
        if (!rows[j].forecast) { prevRow = rows[j]; break; }
      }
    }
    return `<tr data-ri="${ri}"${trCls}>${COLS.map(col => {
      const vcls = col.cls ? col.cls(row) : '';
      if (col.k === 'm') {
        const del = isForecast ? `<button class="del-row-btn" onclick="deleteRow(${ri})" title="Удалить">×</button>` : '';
        return `<td>${col.fmt(row)}${del}</td>`;
      }
      if (col.ed === true) {
        const badge = MOM_COLS.has(col.k) ? momBadge(row[col.k], prevRow?.[col.k]) : '';
        return `<td class="editable ${vcls}${badge?' has-delta':''}" data-field="${col.k}"><input type="text" value="${col.fmt(row)}" inputmode="decimal">${badge}</td>`;
      }
      if (col.ed === 'rev') {
        const dv = col.val ? col.val(row) : col.fmt(row);
        const badge = MOM_COLS.has(col.k) ? momBadge(row[col.k], prevRow?.[col.k]) : '';
        return `<td class="formula ${vcls}${badge?' has-delta':''}" data-field="${col.k}"><input type="text" value="${dv}" inputmode="decimal">${badge}</td>`;
      }
      return `<td class="${vcls}">${col.fmt(row)}</td>`;
    }).join('')}</tr>`;
  }).join('');

  // Attach events
  document.querySelectorAll('#tbody input').forEach(inp => {
    inp.addEventListener('input',   onCellInput);
    inp.addEventListener('keydown', onCellKeydown);
    inp.addEventListener('change',  onCellEdit);
    inp.addEventListener('focus',   onCellFocus);
    inp.addEventListener('blur',    onCellBlur);
  });

  renderTotals(rows);
  restoreRemoteEditors();
}

function renderTotals(rows) {
  const data = rows.filter(r => !r.forecast);
  if (!data.length) { document.getElementById('tfoot').innerHTML = ''; return; }
  const sumI = data.reduce((a,r)=>a+r.i, 0);
  const sumC = data.reduce((a,r)=>a+r.c, 0);
  const sumS = data.reduce((a,r)=>a+r.s, 0);
  const sumR = data.reduce((a,r)=>a+r.r, 0);
  const sumP = data.reduce((a,r)=>a+r.p, 0);
  const sumK = data.reduce((a,r)=>a+r.k, 0);
  const sumJ = data.reduce((a,r)=>a+r.j, 0);
  const avgB = data.reduce((a,r)=>a+r.b, 0) / data.length;
  const avgD = data.reduce((a,r)=>a+r.d, 0) / data.length;
  const totCtr  = sumI ? (sumC/sumI*100) : 0;
  const totCpc  = sumC ? (sumS/sumC) : 0;
  const totDrr  = sumR ? (sumS/sumR*100) : 0;
  const totRomi = sumS ? ((sumR-sumS)/sumS*100) : 0;
  const totCpo  = sumP ? (sumS/sumP) : 0;
  const totAvg  = sumP ? (sumR/sumP) : 0;
  const cells = [
    `<td>Итого (${data.length} мес.)</td>`,
    `<td class="tot-sum">${fmt.num(Math.round(sumI))}</td>`,
    `<td class="tot-sum">${fmt.num(Math.round(sumC))}</td>`,
    `<td class="tot-avg">${totCtr.toFixed(2)}%</td>`,
    `<td class="tot-sum">${fmt.num(Math.round(sumS))}</td>`,
    `<td class="tot-avg">${fmt.dec(totCpc)}</td>`,
    `<td class="tot-avg">${avgB.toFixed(1)}</td>`,
    `<td class="tot-avg">${avgD.toFixed(2)}</td>`,
    `<td class="tot-sum">${sumJ}</td>`,
    `<td class="tot-sum">${sumK}</td>`,
    `<td class="tot-sum">${sumP}</td>`,
    `<td class="tot-sum">${fmt.num(Math.round(sumR))}</td>`,
    `<td class="tot-avg ${totDrr<80?'pos':totDrr>120?'neg':'warn'}">${totDrr.toFixed(1)}%</td>`,
    `<td class="tot-avg ${totRomi>=0?'pos':'neg'}">${totRomi.toFixed(1)}%</td>`,
    `<td class="tot-avg">${fmt.num(Math.round(totCpo))}</td>`,
    `<td class="tot-avg">${fmt.num(Math.round(totAvg))}</td>`,
  ];
  document.getElementById('tfoot').innerHTML = '<tr>' + cells.join('') + '</tr>';
}

// Patch formula cells in a row (no re-render of raw inputs)
function patchComputedCells(tr, row) {
  COLS.forEach((col, ci) => {
    if (col.ed !== 'rev') return;
    const td = tr.children[ci];
    if (!td) return;
    const inp = td.querySelector('input');
    if (inp && document.activeElement !== inp) {
      inp.value = col.val ? col.val(row) : col.fmt(row);
    }
    td.className = 'formula ' + (col.cls ? col.cls(row) : '');
  });
}

// Парсит инпут и обновляет state + UI.
// Для rev-ячеек: goal-seek (target → обратный пересчёт raw-полей).
// Для raw-ячеек: прямое обновление.
function _applyInput(inp, tr, ri, field) {
  const col = COLS.find(c => c.k === field);
  if (!col) return null;
  const rawStr = inp.value.replace(/\s/g,'').replace(',','.');

  if (col.ed === 'rev') {
    const target = col.parse ? col.parse(rawStr) : parseFloat(rawStr);
    if (isNaN(target)) return null;
    const updates = col.rev(target, state[brand][ri]);
    if (!updates) return null;
    Object.assign(state[brand][ri], updates);
    const row = compute(state[brand][ri]);
    patchComputedCells(tr, row);
    // Обновить raw-инпуты которые изменились
    for (const [f, v] of Object.entries(updates)) {
      const rawInp = tr.querySelector(`td[data-field="${f}"] input`);
      if (rawInp && document.activeElement !== rawInp) rawInp.value = v;
    }
    updateChartsInPlace();
    renderKPIs();
    renderTotals(state[brand].map(compute));
    return {rev: true, updates};
  }

  const val = parseFloat(rawStr);
  if (isNaN(val)) return null;
  const prevRow = {...state[brand][ri]}; // снимок до правки (нужен для linked-расчёта)
  state[brand][ri][field] = val;
  const linked = col.linked ? col.linked(val, prevRow) : {};
  Object.assign(state[brand][ri], linked);
  const row = compute(state[brand][ri]);
  patchComputedCells(tr, row);
  // Обновить инпуты связанных raw-полей
  for (const [f, v] of Object.entries(linked)) {
    const lInp = tr.querySelector(`td[data-field="${f}"] input`);
    if (lInp && document.activeElement !== lInp) lInp.value = v;
  }
  updateChartsInPlace();
  renderKPIs();
  renderTotals(state[brand].map(compute));
  return {val, linked};
}

// Мгновенный пересчёт при каждом нажатии клавиши (без WS-broadcast)
function onCellInput(e) {
  const tr    = e.target.closest('tr');
  const td    = e.target.closest('td');
  const ri    = +tr.dataset.ri;
  const field = td.dataset.field;
  _applyInput(e.target, tr, ri, field);
}

// Enter: зафиксировать, отправить WS и перейти к следующей строке
function onCellKeydown(e) {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const tr    = e.target.closest('tr');
  const td    = e.target.closest('td');
  const ri    = +tr.dataset.ri;
  const field = td.dataset.field;
  const result = _applyInput(e.target, tr, ri, field);
  if (result !== null) {
    if (result?.rev && result?.updates) {
      for (const [f, v] of Object.entries(result.updates))
        sendWS({type:'edit', brand, ri, field: f, value: v});
    } else if (result?.val !== undefined) {
      sendWS({type:'edit', brand, ri, field, value: result.val});
      for (const [f, v] of Object.entries(result.linked || {}))
        sendWS({type:'edit', brand, ri, field: f, value: v});
    }
  }
  const nextInp = document.querySelector(`#tbody tr[data-ri="${ri+1}"] td[data-field="${field}"] input`);
  if (nextInp) { nextInp.focus(); nextInp.select(); }
  else e.target.blur();
}

// WS-broadcast при потере фокуса (финальное значение)
function onCellEdit(e) {
  const tr    = e.target.closest('tr');
  const td    = e.target.closest('td');
  const ri    = +tr.dataset.ri;
  const field = td.dataset.field;
  const col   = COLS.find(c => c.k === field);

  const histLabel = `${BRAND_META[brand].label} · ${monthLabel(state[brand][ri].m)} · ${col?.l || field}`;

  if (col?.ed === 'rev') {
    const rawStr = e.target.value.replace(/\s/g,'').replace(',','.');
    const target = col.parse ? col.parse(rawStr) : parseFloat(rawStr);
    const row = compute(state[brand][ri]);
    if (isNaN(target)) {
      e.target.value = col.val ? col.val(row) : col.fmt(row);
      return;
    }
    for (const f of (col.deps || []))
      sendWS({type:'edit', brand, ri, field: f, value: state[brand][ri][f]});
    e.target.value = col.val ? col.val(row) : col.fmt(row);
    pushHistory(histLabel);
    return;
  }

  const raw   = e.target.value.replace(/\s/g,'').replace(',','.');
  const val   = parseFloat(raw);
  if (isNaN(val)) { e.target.value = state[brand][ri][field]; return; }
  state[brand][ri][field] = val;
  sendWS({type:'edit', brand, ri, field, value: val});
  for (const f of (col?.linkedFields || []))
    sendWS({type:'edit', brand, ri, field: f, value: state[brand][ri][f]});
  pushHistory(histLabel);
}

function onCellFocus(e) {
  const td    = e.target.closest('td');
  const tr    = e.target.closest('tr');
  const ri    = +tr.dataset.ri;
  const field = td.dataset.field;
  sendWS({type:'focus', brand, ri, field});
}

function onCellBlur(e) {
  const td    = e.target.closest('td');
  const tr    = e.target.closest('tr');
  const ri    = +tr.dataset.ri;
  const field = td.dataset.field;
  sendWS({type:'blur', brand, ri, field});
}

// ═══════════════════════════════════════════════════════════════
//  FULL REFRESH vs SURGICAL UPDATE
// ═══════════════════════════════════════════════════════════════
function fullRefresh() {
  renderKPIs();
  renderCharts();
  renderTable();
  renderAnalytics();
}

// ═══════════════════════════════════════════════════════════════
//  TABS
// ═══════════════════════════════════════════════════════════════
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    brand = btn.dataset.brand;
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    fullRefresh();
  });
});

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
fullRefresh();
connectWS();
initHistory();
</script>
</body>
</html>
